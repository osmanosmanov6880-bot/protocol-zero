name: PROTOCOL ZERO validation
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check syntax
        run: npm run check
      - name: Run SQLite and signed bridge tests
        run: npm test
      - name: Run fresh-process smoke test
        run: npm run smoke
